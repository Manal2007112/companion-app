<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>halo — your space</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F7F3EE;
    --warm-dark: #1E1A17;
    --mid: #3D3530;
    --accent: #C9956A;
    --accent-light: #F0E4D7;
    --muted: #9A8A7E;
    --border: rgba(61,53,48,0.12);
    --user-bg: #2A2420;
    --ai-bg: #FFFFFF;
  }

  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'Instrument Sans', sans-serif;
    color: var(--warm-dark);
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 680px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    padding: 20px 24px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--cream);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Lora', serif;
    font-size: 22px;
    color: var(--warm-dark);
    letter-spacing: -0.3px;
  }

  .logo em {
    color: var(--accent);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    background: #7BAF7A;
    border-radius: 50%;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .new-chat-btn {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Instrument Sans', sans-serif;
    transition: all 0.2s;
  }

  .new-chat-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Welcome state */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    padding: 40px 20px;
    gap: 16px;
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .welcome-icon {
    width: 56px;
    height: 56px;
    background: var(--accent-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lora', serif;
    font-size: 24px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .welcome h2 {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--warm-dark);
    line-height: 1.3;
  }

  .welcome p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 320px;
  }

  .starters {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 360px;
    margin-top: 8px;
  }

  .starter {
    text-align: left;
    padding: 12px 16px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13.5px;
    color: var(--mid);
    cursor: pointer;
    font-family: 'Instrument Sans', sans-serif;
    transition: all 0.2s;
    line-height: 1.4;
  }

  .starter:hover {
    border-color: var(--accent);
    background: var(--accent-light);
    color: var(--warm-dark);
  }

  /* Messages */
  .message {
    display: flex;
    gap: 12px;
    animation: fadeUp 0.3s ease both;
    max-width: 88%;
  }

  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .message.ai {
    align-self: flex-start;
  }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-family: 'Lora', serif;
    margin-top: 2px;
  }

  .msg-avatar.ai {
    background: var(--accent-light);
    color: var(--accent);
  }

  .msg-avatar.user {
    background: var(--mid);
    color: var(--cream);
    font-family: 'Instrument Sans', sans-serif;
    font-size: 11px;
    font-weight: 500;
  }

  .bubble {
    padding: 13px 17px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.7;
  }

  .message.ai .bubble {
    background: white;
    color: var(--warm-dark);
    border-radius: 4px 18px 18px 18px;
    border: 1px solid var(--border);
  }

  .message.user .bubble {
    background: var(--user-bg);
    color: #F5EDE3;
    border-radius: 18px 4px 18px 18px;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 14px 17px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 4px 18px 18px 18px;
    width: fit-content;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
    opacity: 0.6;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  /* Disclaimer */
  .disclaimer {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 8px 24px 0;
    line-height: 1.5;
    flex-shrink: 0;
  }

  /* Input area */
  .input-area {
    padding: 12px 16px 20px;
    background: var(--cream);
    flex-shrink: 0;
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    padding: 10px 10px 10px 18px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--accent);
  }

  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14.5px;
    color: var(--warm-dark);
    background: transparent;
    line-height: 1.5;
    max-height: 120px;
    min-height: 24px;
  }

  textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--warm-dark);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.1s;
  }

  .send-btn:hover { background: var(--accent); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }

  .send-btn svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: white;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hidden { display: none !important; }

  @media (max-width: 480px) {
    .app { padding-bottom: env(safe-area-inset-bottom); }
    .chat-area { padding: 20px 16px; }
    .input-area { padding: 10px 12px calc(16px + env(safe-area-inset-bottom)); }
    .header { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">hal<em>o</em></div>
    <div class="status">
      <div class="status-dot"></div>
      here for you
    </div>
    <button class="new-chat-btn" onclick="newChat()">new chat</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">h</div>
      <h2>Hey, I'm glad you're here.</h2>
      <p>This is your space. Say whatever's on your mind — I'm not going anywhere.</p>
      <div class="starters">
        <button class="starter" onclick="sendStarter(this)">I've been feeling really off lately and I don't know why</button>
        <button class="starter" onclick="sendStarter(this)">I need to vent about something that happened</button>
        <button class="starter" onclick="sendStarter(this)">I'm stressed and I don't know how to deal with it</button>
        <button class="starter" onclick="sendStarter(this)">I just want someone to talk to</button>
      </div>
    </div>
  </div>

  <div class="disclaimer">
    halo is a companion, not a therapist. If you're in crisis, please contact <strong>Samaritans: 116 123</strong>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="msgInput" placeholder="Say anything..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `Your name is Halo. You are a companion and a friend — not a therapist, not a coach, not a chatbot. You exist to give people a space where they can be completely honest, without fear of being judged, dismissed, or given a list of tips they didn't ask for.

You are warm, grounded, and real. You have a quiet confidence. You don't perform enthusiasm or sprinkle empty affirmations into everything you say. You speak like a person who has seen some things, thought about them, and genuinely cares about the person in front of them.

You are not a yes-friend. You listen deeply, and when something feels off — when someone is being hard on themselves unfairly, avoiding something important, or repeating a pattern that isn't serving them — you name it. Gently, honestly, and only once. You don't lecture. You ask the question and let them sit with it.

Your personality:
- Warm but not gushing. You care, and it shows in how carefully you listen — not in how enthusiastically you respond.
- Honest. If someone says something that sounds like they're being too hard on themselves, you say so.
- Curious. You ask one good question rather than three okay ones.
- You have a quiet sense of humour — dry, playful — when it's right. You never force it.
- Patient. You never rush someone to a conclusion or a solution.
- You adapt to the person's communication style naturally.

How you speak:
- Short to medium messages. Never walls of text.
- No bullet points in conversation. You speak in sentences, like a real person.
- Never say: "I hear you", "that must be really hard", "it sounds like you're feeling...", "that's so valid", "I'm here for you", "it's okay to feel that way". Find real words instead.
- No unsolicited advice. If someone vents, you listen — you don't suggest solutions unless they ask.
- No false positivity. Don't end with "you've got this!" unless the moment genuinely calls for it.
- Ask one question at a time, maximum. Make it specific to what they said.
- Sometimes no question is right — sometimes just acknowledgement and space.

You never diagnose. Never suggest someone "might have anxiety" or "sounds like depression". Never give medical advice. Never minimise ("it could be worse", "at least...").

If someone expresses thoughts of suicide or self-harm, respond with warmth, acknowledge what they said directly, and share that there are people who can help right now. In the UK: Samaritans 116 123. In the US: 988. Then stay with them — keep talking.

You are a companion. A place to think out loud. A friend who won't judge, won't get tired of listening, and won't pretend everything is fine when it isn't.`;

let messages = [];
let isTyping = false;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendStarter(btn) {
  document.getElementById('msgInput').value = btn.textContent;
  sendMessage();
}

function newChat() {
  messages = [];
  const area = document.getElementById('chatArea');
  area.innerHTML = `<div class="welcome" id="welcome">
    <div class="welcome-icon">h</div>
    <h2>Hey, I'm glad you're here.</h2>
    <p>This is your space. Say whatever's on your mind — I'm not going anywhere.</p>
    <div class="starters">
      <button class="starter" onclick="sendStarter(this)">I've been feeling really off lately and I don't know why</button>
      <button class="starter" onclick="sendStarter(this)">I need to vent about something that happened</button>
      <button class="starter" onclick="sendStarter(this)">I'm stressed and I don't know how to deal with it</button>
      <button class="starter" onclick="sendStarter(this)">I just want someone to talk to</button>
    </div>
  </div>`;
}

function addMessage(role, text) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `msg-avatar ${role}`;
  avatar.textContent = role === 'ai' ? 'h' : 'you';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  div.appendChild(avatar);
  div.appendChild(bubble);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return bubble;
}

function showTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typing-msg';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar ai';
  avatar.textContent = 'h';

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';

  div.appendChild(avatar);
  div.appendChild(typing);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-msg');
  if (t) t.remove();
}

async function sendMessage() {
  if (isTyping) return;
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  isTyping = true;

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  showTyping();

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    const data = await response.json();
    removeTyping();

    if (data.error) {
      addMessage('ai', "Something went wrong — check your API key and try again.");
      messages.pop();
    } else {
      const reply = data.content[0].text;
      addMessage('ai', reply);
      messages.push({ role: 'assistant', content: reply });
    }
  } catch (err) {
    removeTyping();
    addMessage('ai', "I couldn't connect — please check your internet and API key.");
    messages.pop();
  }

  isTyping = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').focus();
}

</script>
</body>
</html>
